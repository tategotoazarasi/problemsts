name: Deploy Documentation

on:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write # 必须赋予写权限以便推送到 gh-pages 分支

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Documentation
        # 这会根据 typedoc.json 将文档生成到 ./docs 文件夹
        run: npm run docs

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 对应 typedoc.json 中的 "out" 目录
          publish_dir: ./docs
          # 默认推送到 gh-pages 分支，保持默认即可
          # force_orphan: true # 可选：每次都创建一个干净的历史记录